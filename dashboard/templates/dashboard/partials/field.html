{% if field.widget_type == "checkbox" %}
<label class="field toggle-field{% if field.errors %} has-error{% endif %}">
  <span class="toggle-text">
    <span class="label">{{ field.label }}</span>
    {% if field.help_text %}<span class="help">{{ field.help_text }}</span>{% endif %}
  </span>
  {{ field }}
</label>
{% else %}
<div class="field{% if field.errors %} has-error{% endif %}{% if wide %} wide{% endif %}">
  <label class="label" for="{{ field.id_for_label }}">{{ field.label }}{% if not field.field.required %} <span class="opt">optional</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<span class="help">{{ field.help_text }}</span>{% endif %}
  {% for e in field.errors %}<span class="error">{{ e }}</span>{% endfor %}
</div>
{% endif %}
